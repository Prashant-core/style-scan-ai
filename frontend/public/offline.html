<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f4f3f0" />
    <title>You are offline | StyleScan AI</title>
    <style>
      :root { --paper: #f4f3f0; --ink: #141414; --muted: #6a6965; --line: #dedcd7; --accent: #ffc933; }
      @media (prefers-color-scheme: dark) {
        :root { --paper: #111110; --ink: #ecebe7; --muted: #9a9993; --line: #2a2a28; }
      }
      * { box-sizing: border-box; }
      body {
        margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px;
        background: var(--paper); color: var(--ink);
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      }
      main { max-width: 420px; text-align: center; }
      .mark { width: 64px; height: 64px; margin: 0 auto 28px; }
      .mark rect { fill: var(--ink); }
      .mark ellipse { stroke: var(--paper); }
      h1 { margin: 0; font-size: 2rem; font-weight: 500; letter-spacing: -0.03em; }
      p { margin: 12px 0 0; color: var(--muted); line-height: 1.6; font-size: 1.05rem; }
      button {
        margin-top: 28px; border: 0; border-radius: 999px; padding: 14px 28px; cursor: pointer;
        background: var(--accent); color: #141414; font: inherit; font-weight: 500;
      }
      button:active { transform: scale(0.98); }
    </style>
  </head>
  <body>
    <main>
      <svg class="mark" viewBox="0 0 32 32" fill="none" aria-hidden="true">
        <rect width="32" height="32" rx="7" />
        <ellipse cx="16" cy="16" rx="6.5" ry="8.5" stroke-width="1.6" />
        <path d="M7 16h18M7 12.5v7M25 12.5v7" stroke="#ffc933" stroke-width="2" stroke-linecap="round" />
      </svg>
      <h1>You are offline</h1>
      <p>StyleScan needs the internet to open. Check your connection, then try again. Your saved photos are safe.</p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
